services:
  # ==================== БАЗЫ ДАННЫХ ====================

  postgres:
    image: postgres:17-alpine
    container_name: polygon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: polygon
      POSTGRES_PASSWORD: polygon_password
      POSTGRES_DB: polygon
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - polygon-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U polygon']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: polygon-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - polygon-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== MESSAGE BROKER ====================

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: polygon-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: polygon
      RABBITMQ_DEFAULT_PASS: polygon_password
    ports:
      - '5672:5672' # AMQP
      - '15672:15672' # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - polygon-network
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 30s
      timeout: 10s
      retries: 5

  # ==================== МОНИТОРИНГ ====================

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: polygon-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d' # хранить данные 15 дней
      - '--web.enable-lifecycle' # позволяет перезагружать конфиг без рестарта
    ports:
      - '9090:9090'
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - 'host.docker.internal:host-gateway' # доступ к сервисам на хост-машине
    networks:
      - polygon-network

  grafana:
    image: grafana/grafana:11.1.0
    container_name: polygon-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: polygon_grafana
      GF_USERS_ALLOW_SIGN_UP: 'false'
    ports:
      - '3010:3000' # порт 3010 чтобы не конфликтовать с gateway (3000)
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - polygon-network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:

networks:
  polygon-network:
    driver: bridge
