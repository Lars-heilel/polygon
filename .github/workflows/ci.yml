name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  actions: read
  contents: read

env:
  NX_TEST_CMD: ${{ github.event_name == 'pull_request' && 'affected' || 'run-many' }}
  NX_AFFECTED_BASE: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
  # Добавляем явные переменные для NX
  NX_BASE: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
  NX_HEAD: ${{ github.event.pull_request.head.ref || github.ref_name }}

jobs:
  # ── Job 1: Lint, format, typecheck ──────────────────────────────────
  check:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_LEGACY_PEER_DEPS: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npx nx format:check --base=$NX_BASE --head=$NX_HEAD

      - name: Lint
        run: |
          if [ "$NX_TEST_CMD" = "affected" ]; then
            npx nx affected -t lint --base=$NX_AFFECTED_BASE --parallel=3
          else
            npx nx run-many -t lint --parallel=3
          fi

      - name: Typecheck
        run: |
          if [ "$NX_TEST_CMD" = "affected" ]; then
            npx nx affected -t typecheck --base=$NX_AFFECTED_BASE --parallel=3
          else
            npx nx run-many -t typecheck --parallel=3
          fi

  # ── Job 2: Tests (unit + integration) ───────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: check
    env:
      NPM_CONFIG_LEGACY_PEER_DEPS: true

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: polygon
          POSTGRES_PASSWORD: polygon_password
          POSTGRES_DB: polygon
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma clients
        run: |
          for SERVICE in user auth chat media notification; do
            cd libs/backend/$SERVICE
            npx prisma generate
            cd $GITHUB_WORKSPACE
          done

      - name: Create .env.test
        run: |
          cat > .env.test << 'EOF'
          USER_PORT=3001
          AUTH_PORT=3002
          CHAT_PORT=3003
          MEDIA_PORT=3004
          NOTIFICATION_PORT=3005
          DATABASE_HOST=localhost
          DATABASE_PORT=5432
          DATABASE_USER=polygon
          DATABASE_PASSWORD=polygon_password
          DATABASE_NAME_PREFIX=polygon_
          AUTH_DATABASE_URL=postgresql://polygon:polygon_password@localhost:5432/polygon_auth_test
          USER_DATABASE_URL=postgresql://polygon:polygon_password@localhost:5432/polygon_user_test
          CHAT_DATABASE_URL=postgresql://polygon:polygon_password@localhost:5432/polygon_chat_test
          NOTIFICATION_DATABASE_URL=postgresql://polygon:polygon_password@localhost:5432/polygon_notification_test
          MEDIA_DATABASE_URL=postgresql://polygon:polygon_password@localhost:5432/polygon_media_test
          REDIS_HOST=localhost
          REDIS_PORT=6379
          REDIS_PASSWORD=
          RABBITMQ_HOST=localhost
          RABBITMQ_PORT=5672
          RABBITMQ_MANAGEMENT_PORT=15672
          RABBITMQ_USER=polygon
          RABBITMQ_PASSWORD=polygon_password
          JWT_ACCESS_SECRET=ci_access_secret_min_32_chars_xxxxxxxx
          JWT_REFRESH_SECRET=ci_refresh_secret_min_32_chars_xxxxxxx
          JWT_ACCESS_TOKEN_EXPIRES=900
          JWT_REFRESH_TOKEN_EXPIRES=604800
          SMTP_HOST=localhost
          SMTP_PORT=1025
          SMTP_USER=
          SMTP_PASSWORD=
          SMTP_FROM=Polygon <noreply@polygon.app>
          APP_URL=http://localhost:3000
          CLIENT_URL=http://localhost:4200
          GITHUB_CLIENT_ID=not-configured
          GITHUB_CLIENT_SECRET=not-configured
          YANDEX_CLIENT_ID=not-configured
          YANDEX_CLIENT_SECRET=not-configured
          GOOGLE_CLIENT_ID=not-configured
          GOOGLE_CLIENT_SECRET=not-configured
          NODE_ENV=test
          LOG_LEVEL=error
          EOF

      - name: Bootstrap test databases
        run: CI=true ./scripts/bootstrap.test.sh
        env:
          PGUSER: polygon
          PGPASSWORD: polygon_password
          PGHOST: localhost
          PGPORT: 5432

      - name: Run tests
        run: |
          if [ "$NX_TEST_CMD" = "affected" ]; then
            npx nx affected -t test --base=$NX_AFFECTED_BASE --parallel=3 --coverage
          else
            npx nx run-many -t test --parallel=3 --coverage
          fi
        env:
          NODE_ENV: test