name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

env:
  NX_NO_CLOUD: true
  NPM_CONFIG_LEGACY_PEER_DEPS: true
  NX_REJECT_UNKNOWN_LOCAL_CACHE: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Shared: install + cache ─────────────────────────────────────────
  setup:
    name: Setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: nrwl/nx-set-shas@v4

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

  # ── Job 1: Lint, format, typecheck (all branches) ───────────────────
  check:
    name: Lint & Typecheck
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: nrwl/nx-set-shas@v4

      - name: Format check
        run: npx nx format:check

      - name: Lint
        run: npx nx affected -t lint --parallel=3

      - name: Typecheck
        run: npx nx affected -t typecheck --parallel=3

  # ── Job 2: Tests (main only — production gate) ──────────────────────
  test:
    name: Tests
    needs: setup
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: polygon
          POSTGRES_PASSWORD: polygon_password
          POSTGRES_DB: polygon
        ports: [5432:5432]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports: [5672:5672]
        options: --health-cmd "rabbitmq-diagnostics ping" --health-interval 10s --health-timeout 10s --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: nrwl/nx-set-shas@v4

      - name: Generate Prisma clients
        run: npx nx run-many -t prisma-generate --projects=@org/user,@org/auth,@org/chat,@org/notification --parallel=3

      - name: Create .env.test
        run: |
          cat > .env.test << 'EOF'
          DATABASE_HOST=localhost
          DATABASE_PORT=5432
          DATABASE_USER=polygon
          DATABASE_PASSWORD=polygon_password
          AUTH_DATABASE_URL=postgresql://polygon:polygon_password@localhost:5432/polygon_auth_test
          USER_DATABASE_URL=postgresql://polygon:polygon_password@localhost:5432/polygon_user_test
          CHAT_DATABASE_URL=postgresql://polygon:polygon_password@localhost:5432/polygon_chat_test
          NOTIFICATION_DATABASE_URL=postgresql://polygon:polygon_password@localhost:5432/polygon_notification_test
          MEDIA_DATABASE_URL=postgresql://polygon:polygon_password@localhost:5432/polygon_media_test
          REDIS_HOST=localhost
          REDIS_PORT=6379
          RABBITMQ_HOST=localhost
          RABBITMQ_PORT=5672
          JWT_ACCESS_SECRET=ci_access_secret_min_32_chars_xxxxxxxx
          JWT_REFRESH_SECRET=ci_refresh_secret_min_32_chars_xxxxxxx
          NODE_ENV=test
          LOG_LEVEL=error
          EOF

      - name: Bootstrap test databases
        run: CI=true ./scripts/bootstrap.test.sh
        env:
          PGUSER: polygon
          PGPASSWORD: polygon_password
          PGHOST: localhost

      - name: Run tests
        run: npx nx affected -t test --parallel=3 --coverage
        env:
          NODE_ENV: test

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # ── Job 3: Build (main only — production gate) ──────────────────────
  build:
    name: Build
    needs: setup
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: nrwl/nx-set-shas@v4

      - name: Build affected projects
        run: npx nx affected -t build --parallel=3
