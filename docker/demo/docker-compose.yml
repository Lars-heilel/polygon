services:
  postgres:
    image: postgres:17-alpine
    container_name: polygon-demo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: polygon
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../infra/db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - polygon-demo-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: polygon-demo-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - polygon-demo-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: polygon-demo-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - polygon-demo-network
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: polygon-demo-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - polygon-demo-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:7700/health']
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: polygon-demo-nginx
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      backend:
        condition: service_started
    networks:
      - polygon-demo-network
    deploy:
      resources:
        limits:
          memory: 128M

  backend:
    build:
      context: ../..
      dockerfile: docker/demo/Dockerfile
    container_name: polygon-demo-backend
    restart: unless-stopped
    env_file: ../../.env.production
    environment:
      AUTH_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/polygon_auth
      USER_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/polygon_user
      CHAT_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/polygon_chat
      NOTIFICATION_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/polygon_notification
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      REDIS_HOST: redis
      MEILISEARCH_URL: http://meilisearch:7700
      APP_URL: https://www.polygon-by-lars-heilel.ru
      CLIENT_URL: https://www.polygon-by-lars-heilel.ru
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      LOKI_URL: http://loki:3100
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  minio:
    image: quay.io/minio/minio
    container_name: polygon-demo-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - polygon-demo-network

  rabbitmq:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    networks:
      - polygon-demo-network
    deploy:
      resources:
        limits:
          memory: 2G

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: polygon-demo-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    volumes:
      - ../../infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - polygon-demo-network
    deploy:
      resources:
        limits:
          memory: 256M

  grafana:
    image: grafana/grafana:11.1.0
    container_name: polygon-demo-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ../../infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - polygon-demo-network
    deploy:
      resources:
        limits:
          memory: 256M

  loki:
    image: grafana/loki:3.0.0
    container_name: polygon-demo-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ../../infra/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    networks:
      - polygon-demo-network
    deploy:
      resources:
        limits:
          memory: 256M

  tempo:
    image: grafana/tempo:2.5.0
    container_name: polygon-demo-tempo
    restart: unless-stopped
    user: root
    command: -config.file=/etc/tempo/tempo.yml
    volumes:
      - ../../infra/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/tmp/tempo
    networks:
      - polygon-demo-network
    deploy:
      resources:
        limits:
          memory: 256M

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.102.0
    container_name: polygon-demo-otel-collector
    restart: unless-stopped
    command: ['--config=/etc/otel/otel-collector.yml']
    volumes:
      - ../../infra/otel-collector/otel-collector.yml:/etc/otel/otel-collector.yml:ro
    depends_on:
      - tempo
    networks:
      - polygon-demo-network
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres_data:
  redis_data:
  minio_data:
  rabbitmq_data:
  meilisearch_data:
  prometheus_data:
  grafana_data:
  loki_data:
  tempo_data:

networks:
  polygon-demo-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
