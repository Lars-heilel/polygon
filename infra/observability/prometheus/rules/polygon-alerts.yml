# NOTE: no Alertmanager/receiver routing; alerts visible in Prometheus/Grafana UI only.
groups:
  - name: polygon-service-health
    rules:
      - alert: PolygonServiceDown
        expr: up{job="polygon-backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'Polygon backend target is down'
          description: 'Prometheus cannot scrape {{ $labels.instance }} for more than 2 minutes.'

      - alert: PolygonHighErrorRate
        expr: sum(rate(polygon_http_requests_total{status_code=~"5.."}[5m])) by (service) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'High 5xx rate on {{ $labels.service }}'
          description: '{{ $labels.service }} returns more than 0.05 5xx responses per second.'

      - alert: PolygonHighP95Latency
        expr: histogram_quantile(0.95, sum(rate(polygon_http_request_duration_seconds_bucket[5m])) by (le, service)) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'High p95 latency on {{ $labels.service }}'
          description: '{{ $labels.service }} p95 latency is above 1 second.'

      - alert: GatewayHighP95Latency
        expr: histogram_quantile(0.95, sum(rate(polygon_http_request_duration_seconds_bucket{service="gateway"}[5m])) by (le)) > 0.5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: 'High p95 latency on gateway'
          description: 'Gateway p95 latency is above 0.5 seconds.'

      # Follow-up: dead until guard-rejected 429s are recorded (MetricsInterceptor runs after guards).
      - alert: GatewayThrottleSpike
        expr: sum(rate(polygon_http_requests_total{service="gateway",status_code="429"}[5m])) / sum(rate(polygon_http_requests_total{service="gateway"}[5m])) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: 'Throttle spike on gateway'
          description: 'More than 5% of gateway responses are 429 over the last 5 minutes.'

      - alert: PostgresConnsHigh
        expr: sum(pg_stat_activity_count) / sum(pg_settings_max_connections) > 0.7
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Postgres connections high'
          description: 'Postgres connections are above 70% of max_connections.'

      - alert: GatewayRSSHigh
        expr: max(process_resident_memory_bytes{service="gateway"}) > 2000000000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'High gateway RSS memory'
          description: 'Gateway resident memory is above 2GB.'

  - name: polygon-host-health
    rules:
      - alert: PolygonHostDiskAlmostFull
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) < 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Host disk almost full'
          description: '{{ $labels.mountpoint }} has less than 10% free disk space.'

      - alert: PolygonHostHighCpu
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Host CPU is high'
          description: 'CPU usage is above 85% for more than 10 minutes.'
